[package]
name = "dinput8"
version = "0.4.0"
edition = "2021"
description = "World Race Script Extender: the base mod for Hot Wheels World Race"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = "s"
